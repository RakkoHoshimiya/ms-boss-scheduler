# GMSR BOSS 组队排版系统 —— 1Panel / OpenResty 站点配置
# HTTP: 8080   HTTPS: 4433   网站目录: /opt/1panel/www
# 前端静态文件：/opt/1panel/www/gmsr  （容器内 /www/gmsr）
# 后端 API：127.0.0.1:18080（systemd: gmsr-backend）

upstream gmsr_backend {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name <YOUR_SERVER_IP> gmsr.local _;

    charset utf-8;

    # 安全响应头：凡是自己写了 add_header 的 location 都要再 include 一次
    include /usr/local/openresty/nginx/conf/conf.d/security-headers.inc;


    root /www/gmsr;
    index index.html;
    client_max_body_size 8m;

    access_log /var/log/nginx/gmsr.access.log;
    error_log  /var/log/nginx/gmsr.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    # 语音走 WebRTC：浏览器在 HTTP 页面下会拦截 WebSocket 与麦克风，
    # 因此除「根证书下载 / 证书安装说明」之外，一律 301 跳到 HTTPS。
    location = /gmsr-ca.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition "attachment; filename=gmsr-ca.crt";
        try_files $uri =404;
    }
    location = /ca-check.html {
        try_files $uri =404;
    }
    location = /ca-install.html {
        try_files $uri =404;
    }
    location / {
        return 301 https://$host:4433$request_uri;
    }

    # 明文 HTTP 不接受任何 API 请求（含登录）。
    # 注意不能改成 301/308：请求体和密码在到达服务器时**已经明文传输过一次**，
    # 跳转救不回来。这里直接拒绝，逼客户端从一开始就走 HTTPS。
    location /api/ {
        default_type application/json;
        return 403 '{"code":"HTTPS_REQUIRED","message":"请通过 HTTPS（4433）访问接口"}';
    }

    # 前端使用 HashRouter，兜底交给 index.html

}

server {
    listen 4433 ssl;
    listen [::]:4433 ssl;
    http2 on;
    server_name <YOUR_SERVER_IP> gmsr.local _;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    charset utf-8;

    # 安全响应头：凡是自己写了 add_header 的 location 都要再 include 一次
    include /usr/local/openresty/nginx/conf/conf.d/security-headers.inc;


    root /www/gmsr;
    index index.html;
    client_max_body_size 8m;

    access_log /var/log/nginx/gmsr.access.log;
    error_log  /var/log/nginx/gmsr.error.log warn;

    include /usr/local/openresty/nginx/conf/conf.d/livekit-rtc.inc;

    location /api/ {
        proxy_pass http://gmsr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 诊断页：禁止缓存，避免拿到旧版本（用户排查问题时要保证是最新的）
    location = /voice-debug.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /usr/local/openresty/nginx/conf/conf.d/security-headers.inc;
    }
}
