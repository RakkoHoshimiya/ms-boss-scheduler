# GMSR BOSS 组队排班系统 —— 1Panel / OpenResty 站点配置
# HTTP: 8080   HTTPS: 4433   网站目录: /opt/1panel/www
# 前端静态文件：/opt/1panel/www/gmsr  （容器内 /www/gmsr）
# 后端 API：127.0.0.1:18080（systemd: gmsr-backend）

upstream gmsr_backend {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name <YOUR_SERVER_IP> gmsr.local _;

    charset utf-8;

    # 安全响应头：凡是自己写了 add_header 的 location 都要再 include 一次
    include /usr/local/openresty/nginx/conf/conf.d/security-headers.inc;


    root /www/gmsr;
    index index.html;
    client_max_body_size 8m;

    access_log /var/log/nginx/gmsr.access.log;
    error_log  /var/log/nginx/gmsr.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    location /api/ {
        proxy_pass http://gmsr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 前端使用 HashRouter，兜底交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /usr/local/openresty/nginx/conf/conf.d/security-headers.inc;
    }
}

server {
    listen 4433 ssl;
    listen [::]:4433 ssl;
    http2 on;
    server_name <YOUR_SERVER_IP> gmsr.local _;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    charset utf-8;

    # 安全响应头：凡是自己写了 add_header 的 location 都要再 include 一次
    include /usr/local/openresty/nginx/conf/conf.d/security-headers.inc;


    root /www/gmsr;
    index index.html;
    client_max_body_size 8m;

    access_log /var/log/nginx/gmsr.access.log;
    error_log  /var/log/nginx/gmsr.error.log warn;

    location /api/ {
        proxy_pass http://gmsr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /usr/local/openresty/nginx/conf/conf.d/security-headers.inc;
    }
}
