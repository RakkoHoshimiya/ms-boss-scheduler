name: CI

# 后端：单元测试 + 真实 PostgreSQL/Redis 集成测试 + 迁移校验
# 前端：依赖安装 + 类型检查 + 生产构建
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（含真实库集成测试）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gmsr
          POSTGRES_USER: gmsr_app
          POSTGRES_PASSWORD: gmsr_ci_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gmsr_app -d gmsr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 打开集成测试开关：空库上由 Flyway 建结构，测试自建数据
      GMSR_INTEGRATION_DB: '1'
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gmsr?currentSchema=gmsr
      SPRING_DATASOURCE_USERNAME: gmsr_app
      SPRING_DATASOURCE_PASSWORD: gmsr_ci_pwd
      SPRING_FLYWAY_SCHEMAS: gmsr
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: gmsr
      GMSR_REDIS_HOST: localhost
      GMSR_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 运行后端测试
        working-directory: backend
        run: mvn -B verify

      - name: 校验迁移结果（8 张业务表 + history）
        run: |
          set -euo pipefail
          TABLES=$(PGPASSWORD=gmsr_ci_pwd psql -h localhost -U gmsr_app -d gmsr -tAc \
            "select count(*) from information_schema.tables
              where table_schema = 'gmsr' and table_name <> 'flyway_schema_history'")
          echo "业务表数量: $TABLES"
          test "$TABLES" = "8"
          PGPASSWORD=gmsr_ci_pwd psql -h localhost -U gmsr_app -d gmsr -tAc \
            "select version || ' ' || type from gmsr.flyway_schema_history order by installed_rank"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: ignore
